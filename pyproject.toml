[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[project]
name = "d2"
version = "0.9.0"
description = "A Python ORM built around a type-safe query builder, with declarative schemas and integrated migrations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "msgspec>=0.21.1",
    "pypika>=0.51.1",
]

[project.urls]
Homepage = "https://okanakbulut.github.io/d2/"
Documentation = "https://okanakbulut.github.io/d2/"
Repository = "https://github.com/okanakbulut/d2"
Issues = "https://github.com/okanakbulut/d2/issues"

[dependency-groups]
dev = [
    "commitizen==4.13.10",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["d2", "docs", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
markers = [
    "integration: tests that require a running PostgreSQL instance",
]
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--doctest-glob=docs/*.md",
    "--quiet",
    "--tb=long",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.run]
branch = true
source = ["d2"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["d2"]
